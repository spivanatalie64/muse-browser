# muse-browser -- manually triggered smoke test.
#
# Pick an engine track, and this workflow builds the same host layout the
# daemon expects on a fresh ubuntu-latest runner, installs that engine,
# starts the daemon from this repo, and runs the repo's smoke test
# against it. If the daemon or the smoke test fails, the workflow fails:
# no continue-on-error, no cached success. The smoke log is uploaded as
# an artifact either way.
#
# NOTE: a workflow_dispatch workflow only becomes triggerable once this
# file reaches the repository's default branch -- that is, after this
# branch is merged. Until then it can be reviewed here but not run from
# the Actions tab.
name: Smoke test

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine track to smoke-test
        type: choice
        required: true
        default: icecat
        options:
          - firefox
          - icecat
          - firefox-esr

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (${{ inputs.engine }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Runtime libraries for a headless Gecko
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libdbus-glib-1-2 libasound2t64 libxt6 libx11-xcb1

      - name: Create the muse-browser host layout
        run: |
          mkdir -p "$HOME/muse-browser"/{bin,daemon,tests,profiles,logs,dl,lib}
          cp daemon/muse_browserd.py "$HOME/muse-browser/daemon/"
          cp tests/smoke_sprint1.py "$HOME/muse-browser/tests/"

      - name: Install geckodriver 0.37.1
        run: |
          cd "$HOME/muse-browser/dl"
          curl -sL -o geckodriver.tar.gz \
            https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz
          tar -xzf geckodriver.tar.gz -C "$HOME/muse-browser/bin"
          "$HOME/muse-browser/bin/geckodriver" --version

      - name: Install the chosen engine
        run: |
          set -euo pipefail
          cd "$HOME/muse-browser/dl"
          case "${{ inputs.engine }}" in
            firefox)
              curl -sL -o firefox.tar.xz \
                "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US"
              mkdir -p "$HOME/muse-browser/firefox"
              tar -xJf firefox.tar.xz -C "$HOME/muse-browser/firefox" --strip-components=1
              "$HOME/muse-browser/firefox/firefox" --version
              ;;
            firefox-esr)
              curl -sL -o firefox-esr.tar.xz \
                "https://download.mozilla.org/?product=firefox-esr-latest&os=linux64&lang=en-US"
              mkdir -p "$HOME/muse-browser/firefox-esr"
              tar -xJf firefox-esr.tar.xz -C "$HOME/muse-browser/firefox-esr" --strip-components=1
              "$HOME/muse-browser/firefox-esr/firefox" --version
              ;;
            icecat)
              # Same verification as on the server: GNU's 60.7.0 directory
              # publishes only GPG signatures, no checksum file, so the
              # tarball is fetched from two independent GNU mirrors and
              # the sha256 values must agree before anything is unpacked.
              ICECAT_FILE=icecat-60.7.0.en-US.gnulinux-x86_64.tar.bz2
              curl -sL -o icecat-a.tar.bz2 "https://ftp.gnu.org/gnu/gnuzilla/60.7.0/$ICECAT_FILE"
              curl -sL -o icecat-b.tar.bz2 "https://mirrors.kernel.org/gnu/gnuzilla/60.7.0/$ICECAT_FILE"
              A=$(sha256sum icecat-a.tar.bz2 | cut -d' ' -f1)
              B=$(sha256sum icecat-b.tar.bz2 | cut -d' ' -f1)
              echo "ftp.gnu.org sha256:        $A"
              echo "mirrors.kernel.org sha256: $B"
              test "$A" = "$B"
              mkdir -p /tmp/icecat-extract
              tar -xjf icecat-a.tar.bz2 -C /tmp/icecat-extract
              mv /tmp/icecat-extract/icecat "$HOME/muse-browser/icecat"
              "$HOME/muse-browser/icecat/icecat" --version
              ;;
          esac

      - name: Generate a throwaway token and select the track
        run: |
          head -c 32 /dev/urandom | base64 > "$HOME/muse-browser/token"
          chmod 600 "$HOME/muse-browser/token"
          printf '{"track": "%s"}\n' "${{ inputs.engine }}" \
            > "$HOME/muse-browser/config.json"

      - name: Start the daemon
        run: |
          nohup python3 "$HOME/muse-browser/daemon/muse_browserd.py" \
            > "$HOME/muse-browser/logs/daemon.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -X POST \
                 -H "X-Muse-Token: $(cat "$HOME/muse-browser/token")" \
                 -H 'Content-Type: application/json' -d '{}' \
                 http://127.0.0.1:8765/status; then
              echo
              echo "daemon is up"
              exit 0
            fi
            sleep 1
          done
          echo "daemon did not come up; its log:"
          cat "$HOME/muse-browser/logs/daemon.log"
          exit 1

      - name: Run the smoke test
        run: |
          set -o pipefail
          python3 "$HOME/muse-browser/tests/smoke_sprint1.py" "${{ inputs.engine }}" \
            2>&1 | tee "$HOME/muse-browser/logs/smoke-${{ inputs.engine }}-ci.log"

      - name: Upload the smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ inputs.engine }}
          path: |
            ~/muse-browser/logs/smoke-${{ inputs.engine }}-ci.log
            ~/muse-browser/logs/daemon.log
          if-no-files-found: warn
